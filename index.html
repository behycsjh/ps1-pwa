<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PS1 PWA Emulator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d11;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        header {
            height: 50px;
            background: rgba(20, 20, 28, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn {
            background: #2a2a38;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn:active {
            background: #3b3b4f;
        }
        #canvas-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 50px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 17, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 16px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #file-input {
            display: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/nostalgist/dist/nostalgist.umd.js"></script>
</head>
<body>
    <div id="app-container">
        <header>
            <button class="btn" onclick="document.getElementById('file-input').click()">📁 ROM</button>
            <button class="btn" id="install-btn" style="display: none;">📲 Установить</button>
            <button class="btn" onclick="toggleFullscreen()">⛶ Экран</button>
        </header>

        <div id="canvas-container">
            <div id="loading-overlay" style="display: none;">
                <div class="spinner"></div>
                <p id="loading-text">Загрузка ядра и BIOS...</p>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <input type="file" id="file-input" multiple accept=".bin,.cue,.chd,.pbp,.iso,.img,.m3u,.zip">

    <script>
        let currentInstance = null;
        const fileInput = document.getElementById('file-input');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        // Регистрация Service Worker для офлайн работы PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('SW registration failed: ', err);
                });
            });
        }

        // Обработка кнопки установки PWA
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-flex';
        });

        installBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        installBtn.style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        });

        // Запуск выбранных файлов
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            showLoading('Подготовка файлов игры...');

            try {
                if (currentInstance) {
                    await currentInstance.destroy();
                }

                showLoading('Загрузка PS1 BIOS и запуск...');

                // Nostalgist.js запускает ядро pcsx_rearmed с подгрузкой официального BIOS
                currentInstance = await Nostalgist.launch({
                    core: 'pcsx_rearmed',
                    rom: files,
                    bios: [
                        'https://cdn.jsdelivr.net/gh/RetroPie/RetroPie-Setup@master/scriptmodules/emulators/retroarch/bin/scph5501.bin'
                    ],
                    element: document.getElementById('canvas'),
                    style: {
                        width: '100%',
                        height: '100%'
                    }
                });

                hideLoading();
            } catch (err) {
                console.error(err);
                alert('Ошибка при запуске игры: ' + (err.message || err));
                hideLoading();
            }
        });

        function showLoading(text) {
            loadingText.innerText = text;
            loadingOverlay.style.display = 'flex';
        }

        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
