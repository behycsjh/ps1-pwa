<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PS1 PWA Emulator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d11;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        header {
            height: 50px;
            background: rgba(20, 20, 28, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn {
            background: #2a2a38;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn:active {
            background: #3b3b4f;
        }
        #canvas-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 50px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 17, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 16px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Модальное окно настроек */
        #settings-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }
        .modal-content {
            background: #1c1c24;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        select, .file-btn {
            background: #2a2a38;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 6px;
        }
        #file-input, #bios-input {
            display: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/nostalgist/dist/nostalgist.umd.js"></script>
</head>
<body>
    <div id="app-container">
        <header>
            <button class="btn" onclick="document.getElementById('file-input').click()">📁 ROM</button>
            <button class="btn" onclick="toggleFullscreen()">⛶ Экран</button>
            <button class="btn" onclick="openSettings()">⚙️ Настройки</button>
        </header>

        <div id="canvas-container">
            <div id="loading-overlay" style="display: none;">
                <div class="spinner"></div>
                <p id="loading-text">Загрузка игры...</p>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <!-- Модальное окно настроек -->
    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 5px;">⚙️ Настройки</h3>
            
            <div class="setting-row">
                <span>🧠 Системный BIOS:</span>
                <button class="file-btn" onclick="document.getElementById('bios-input').click()">Загрузить BIOS</button>
            </div>
            <div id="bios-info" style="font-size: 11px; color: #34c759; text-align: right;">BIOS не добавлен</div>

            <div class="setting-row">
                <span>🎮 Ядро:</span>
                <select id="core-select">
                    <option value="pcsx_rearmed">PCSX ReARMed</option>
                </select>
            </div>

            <button class="btn" style="background: #34c759; margin-top: 10px; justify-content: center;" onclick="closeSettings()">Продолжить</button>
        </div>
    </div>

    <!-- Скрытые инпуты -->
    <input type="file" id="file-input" multiple accept=".bin,.cue,.chd,.pbp,.iso,.img,.m3u,.zip">
    <input type="file" id="bios-input" multiple accept=".bin,.BIN">

    <script>
        let currentInstance = null;
        let storedBiosFiles = [];

        const fileInput = document.getElementById('file-input');
        const biosInput = document.getElementById('bios-input');
        const settingsModal = document.getElementById('settings-modal');
        const biosInfo = document.getElementById('bios-info');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');

        // Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        // Выбор BIOS через меню настроек
        biosInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            storedBiosFiles = files;
            biosInfo.innerText = "✓ Загружен: " + files.map(f => f.name).join(', ');
            alert("Файл BIOS сохранен! Теперь можно запускать игру.");
        });

        // Запуск файлов игры
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            showLoading('Загрузка и сборка файлов...');

            try {
                if (currentInstance) {
                    await currentInstance.destroy();
                }

                const options = {
                    core: 'pcsx_rearmed',
                    rom: files,
                    element: document.getElementById('canvas'),
                    style: { width: '100%', height: '100%' }
                };

                // Прикрепляем BIOS если он был загружен
                if (storedBiosFiles.length > 0) {
                    options.bios = storedBiosFiles;
                }

                currentInstance = await Nostalgist.launch(options);
                hideLoading();
            } catch (err) {
                console.error(err);
                alert('Ошибка запуска: ' + (err.message || err));
                hideLoading();
            }
        });

        function openSettings() { settingsModal.style.display = 'flex'; }
        function closeSettings() { settingsModal.style.display = 'none'; }
        function showLoading(text) { loadingText.innerText = text; loadingOverlay.style.display = 'flex'; }
        function hideLoading() { loadingOverlay.style.display = 'none'; }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
